<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Practice 6</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="list-container">
    <div class="list-header">
        <div class="header-title">
          <h2>Device Management</h2>
          <span class="device-count">Total 4 Devices</span>
        </div>
        <button class="btn-add">+ ADD Device</button>
    </div>
    <table class="data-table">
        <thead>
        <tr>
          <th>DEVICE NAME</th>
          <th>DEVICE TYPE</th>
          <th>STATUS</th>
          <th>BATTERY</th>
          <th>ACTIONS</th>
        </tr>
        </thead>

        <tbody>
        <!-- 첫번째 줄 -->
        <tr>
          <td>
            <div class="device-info">
              <div class="icon-box icon-light"></div>
              <span class="device-name">Smart Bulb A</span>
            </div>
          </td>
          <td class="place-name">Living-Room</td>
          <td>
            <div class="status-badge badge-online">
              <div class="status-dot"></div>
              <span>Online</span>
            </div>
          </td>
          <td>
            <div class="battery-wrapper">
              <div class="battery-bar">
                <div class="battery-fill" style="width: 85%"></div>
              </div>
              <span class="battery-text">85%</span>
            </div>
          </td>
          <td>
            <button class="btn-edit">Edit</button>
          </td>
        </tr>

        <!-- 두번째 줄 -->
        <tr>
          <td>
            <div class="device-info">
              <div class="icon-box icon-thermostat"></div>
              <span class="device-name">Main Thermostat</span>
            </div>
          </td>
          <td class="place-name">Hallway</td>
          <td>
            <div class="status-badge badge-offline">
              <div class="status-dot"></div>
              <span>Offline</span>
            </div>
          </td>
          <td>
            <div class="battery-wrapper">
              <div class="battery-bar">
                <div class="battery-not-enough" style="width: 15%"></div>
              </div>
              <span class="battery-text">15%</span>
            </div>
          </td>
          <td>
            <button class="btn-edit">Edit</button>
          </td>
        </tr>

        <!-- 세번째 줄 -->
        <tr>
          <td>
            <div class="device-info">
              <div class="icon-box icon-plug"></div>
              <span class="device-name">Coffee Maker Plug</span>
            </div>
          </td>
          <td class="place-name">Kitchen</td>
          <td>
            <div class="status-badge badge-online">
              <div class="status-dot"></div>
              <span>Online</span>
            </div>
          </td>
          <td>
              <span class="plugged-in"><em>Plugged in</em></span>
          </td>
          <td>
            <button class="btn-edit">Edit</button>
          </td>
        </tr>

        <!-- 네번째 줄 -->
        <tr>
          <td>
            <div class="device-info">
              <div class="icon-box icon-camera"></div>
              <span class="device-name">Front Door Camera</span>
            </div>
          </td>
          <td class="place-name">Porch</td>
          <td>
            <div class="status-badge badge-standby">
              <div class="status-dot"></div>
              <span>Standby</span>
            </div>
          </td>
          <td>
            <div class="battery-wrapper">
              <div class="battery-bar">
                <div class="battery-fill" style="width: 60%"></div>
              </div>
              <span class="battery-text">60%</span>
            </div>
          </td>
          <td>
            <button class="btn-edit">Edit</button>
          </td>
        </tr>
        </tbody>
    </table>
  </div>
</body>
</html>

<!-- 내용 추가함 -->
